<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双摄像头视图</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #000;
            color: #fff;
            overflow-x: hidden;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 10px;
        }
        
        .camera-section {
            flex: 1;
            margin-bottom: 10px;
            position: relative;
            border: 2px solid #333;
            border-radius: 8px;
            overflow: hidden;
        }
        
        .camera-section:last-child {
            margin-bottom: 0;
        }
        
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        .label {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 14px;
            z-index: 10;
        }
        
        .error-message {
            padding: 20px;
            text-align: center;
            color: #ff6b6b;
            font-size: 14px;
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 16px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="camera-section" id="frontSection">
            <div class="label">前置摄像头</div>
            <div class="loading">加载中...</div>
            <video id="frontVideo" autoplay playsinline></video>
        </div>
        
        <div class="camera-section" id="rearSection">
            <div class="label">后置摄像头</div>
            <div class="loading">加载中...</div>
            <video id="rearVideo" autoplay playsinline></video>
        </div>
    </div>

    <script>
        const frontVideo = document.getElementById('frontVideo');
        const rearVideo = document.getElementById('rearVideo');
        const frontSection = document.getElementById('frontSection');
        const rearSection = document.getElementById('rearSection');

        async function startCamera(videoElement, facingMode, section) {
            try {
                const constraints = {
                    video: {
                        facingMode: { exact: facingMode },
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                };

                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElement.srcObject = stream;
                
                // 移除加载提示
                const loading = section.querySelector('.loading');
                if (loading) loading.remove();
                
                return true;
            } catch (error) {
                console.error(`无法访问${facingMode}摄像头:`, error);
                
                // 显示错误信息
                const loading = section.querySelector('.loading');
                if (loading) {
                    loading.textContent = `无法访问摄像头: ${error.message}`;
                    loading.style.color = '#ff6b6b';
                }
                
                return false;
            }
        }

        async function initCameras() {
            // 检查浏览器支持
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                alert('您的浏览器不支持摄像头访问');
                return;
            }

            // 请求权限并启动摄像头
            try {
                await startCamera(frontVideo, 'user', frontSection);
                await startCamera(rearVideo, 'environment', rearSection);
            } catch (error) {
                console.error('初始化摄像头失败:', error);
            }
        }

        // 页面加载完成后初始化摄像头
        window.addEventListener('load', initCameras);

        // 页面卸载时停止摄像头
        window.addEventListener('beforeunload', () => {
            [frontVideo, rearVideo].forEach(video => {
                if (video.srcObject) {
                    video.srcObject.getTracks().forEach(track => track.stop());
                }
            });
        });
    </script>
</body>
</html>
