<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双摄像头视图</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #000;
            color: #fff;
            overflow-x: hidden;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 10px;
        }
        
        .camera-section {
            flex: 1;
            margin-bottom: 10px;
            position: relative;
            border: 2px solid #333;
            border-radius: 8px;
            overflow: hidden;
            min-height: 200px;
        }
        
        .camera-section:last-child {
            margin-bottom: 0;
        }
        
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        .label {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 14px;
            z-index: 10;
        }
        
        .error-message {
            padding: 20px;
            text-align: center;
            color: #ff6b6b;
            font-size: 14px;
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 16px;
            color: #aaa;
        }
        
        .composite-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }
        
        .composite-image.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="camera-section" id="frontSection">
            <div class="label">前置摄像头</div>
            <div class="loading">加载中...</div>
            <video id="frontVideo" autoplay playsinline></video>
        </div>
        
        <div class="camera-section" id="rearSection">
            <div class="label">后置摄像头</div>
            <div class="loading">加载中...</div>
            <video id="rearVideo" autoplay playsinline></video>
        </div>
        
        <div class="camera-section" id="compositeSection">
            <div class="label">合成图像</div>
            <div class="loading">等待合成...</div>
            <img id="compositeImage" class="composite-image" alt="合成图像">
        </div>
    </div>

    <script>
        const frontVideo = document.getElementById('frontVideo');
        const rearVideo = document.getElementById('rearVideo');
        const frontSection = document.getElementById('frontSection');
        const rearSection = document.getElementById('rearSection');
        const compositeImage = document.getElementById('compositeImage');
        const compositeSection = document.getElementById('compositeSection');
        let ws;

        async function startCamera(videoElement, facingMode, section) {
            try {
                const constraints = {
                    video: {
                        facingMode: { exact: facingMode },
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                };

                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElement.srcObject = stream;
                
                // 移除加载提示
                const loading = section.querySelector('.loading');
                if (loading) loading.remove();
                
                return true;
            } catch (error) {
                console.error(`无法访问${facingMode}摄像头:`, error);
                
                // 显示错误信息
                const loading = section.querySelector('.loading');
                if (loading) {
                    loading.textContent = `无法访问摄像头: ${error.message}`;
                    loading.style.color = '#ff6b6b';
                }
                
                return false;
            }
        }

        function startFrameLoop(videoElement, cameraName) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const sendFrame = () => {
                if (!ws || ws.readyState !== WebSocket.OPEN) return;
                if (videoElement.readyState < 2) {
                    requestAnimationFrame(sendFrame);
                    return;
                }
                canvas.width = videoElement.videoWidth || 640;
                canvas.height = videoElement.videoHeight || 480;
                ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
                canvas.toBlob(blob => {
                    if (!blob || ws.readyState !== WebSocket.OPEN) {
                        requestAnimationFrame(sendFrame);
                        return;
                    }
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        ws.send(JSON.stringify({ camera: cameraName, data: reader.result }));
                        requestAnimationFrame(sendFrame);
                    };
                    reader.readAsDataURL(blob);
                }, 'image/jpeg', 0.7);
            };
            requestAnimationFrame(sendFrame);
        }

        function connectWebSocket() {
            const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
            ws = new WebSocket(`${protocol}://${location.hostname}:8765`);
            ws.onopen = () => {
                startFrameLoop(frontVideo, 'front');
                startFrameLoop(rearVideo, 'rear');
            };
            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === 'composite' && data.data) {
                        compositeImage.src = data.data;
                        compositeImage.classList.add('active');
                        const loading = compositeSection.querySelector('.loading');
                        if (loading) loading.remove();
                    }
                } catch (error) {
                    console.error('处理消息失败:', error);
                }
            };
            ws.onclose = () => console.warn('WebSocket 连接已关闭');
            ws.onerror = (e) => console.error('WebSocket 错误', e);
        }

        async function initCameras() {
            // 检查浏览器支持
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                alert('您的浏览器不支持摄像头访问');
                return;
            }

            // 请求权限并启动摄像头
            try {
                await startCamera(frontVideo, 'user', frontSection);
                await startCamera(rearVideo, 'environment', rearSection);
                connectWebSocket();
            } catch (error) {
                console.error('初始化摄像头失败:', error);
            }
        }

        // 页面加载完成后初始化摄像头
        window.addEventListener('load', initCameras);

        // 页面卸载时停止摄像头
        window.addEventListener('beforeunload', () => {
            [frontVideo, rearVideo].forEach(video => {
                if (video.srcObject) {
                    video.srcObject.getTracks().forEach(track => track.stop());
                }
            });
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.close();
            }
        });
    </script>
</body>
</html>
